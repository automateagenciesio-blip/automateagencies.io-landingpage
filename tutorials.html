<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorials | Automate Agencies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A0500;
      --orange:    #FF9900;
      --orange-lt: #FFB84D;
      --white:     #ffffff;
      --border:    rgba(255,255,255,0.05);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── KEYFRAMES ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── NAV ── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      background: rgba(10, 5, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      padding: 8px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.2s ease;
    }
    .nav-link:hover {
      color: var(--white);
      border-color: rgba(255,153,0,0.4);
      background: rgba(255,153,0,0.06);
    }
    .nav-link.active {
      color: var(--orange-lt);
      border-color: rgba(255,153,0,0.35);
      background: rgba(255,153,0,0.08);
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 140px 24px 80px;
      position: relative;
      overflow: hidden;
    }

    .hero-grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,153,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,153,0,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 100%);
    }

    .hero-orb {
      position: absolute;
      top: -100px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,153,0,0.10) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 820px;
      width: 100%;
      text-align: center;
    }

    /* Badge */
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255,153,0,0.1);
      border: 1px solid rgba(255,153,0,0.2);
      color: var(--orange-lt);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 32px;
      animation: fade-in 0.8s ease both;
    }
    .hero-badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--orange);
      animation: pulse 2s ease infinite;
    }

    /* Title */
    .hero-title {
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      animation: fade-up 0.8s ease 0.15s both;
    }
    .hero-title-gradient {
      background: linear-gradient(90deg, var(--orange) 0%, var(--orange-lt) 50%, var(--orange) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fade-up 0.8s ease 0.15s both, shimmer 4s linear infinite;
    }

    /* Subtitle */
    .hero-subtitle {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      color: rgba(255,255,255,0.6);
      max-width: 580px;
      margin: 0 auto 40px;
      line-height: 1.75;
      animation: fade-up 0.8s ease 0.3s both;
    }

    /* Search bar */
    .search-wrap {
      position: relative;
      max-width: 560px;
      margin: 0 auto 48px;
      animation: fade-up 0.8s ease 0.4s both;
    }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.35);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 16px 20px 16px 48px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--white);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.35); }
    .search-input:focus {
      border-color: rgba(255,153,0,0.4);
      background: rgba(255,153,0,0.04);
      box-shadow: 0 0 0 3px rgba(255,153,0,0.08);
    }

    /* Continue card */
    .continue-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px 28px;
      border-radius: 16px;
      border: 1px solid rgba(255,153,0,0.2);
      background: rgba(255,153,0,0.04);
      max-width: 700px;
      margin: 0 auto;
      text-align: left;
      animation: fade-up 0.8s ease 0.5s both;
      transition: all 0.25s ease;
    }
    .continue-card:hover {
      border-color: rgba(255,153,0,0.4);
      background: rgba(255,153,0,0.07);
      transform: translateY(-2px);
    }

    /* Progress ring */
    .progress-ring-wrap {
      flex-shrink: 0;
      width: 64px; height: 64px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .progress-ring-svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }
    .progress-ring-track {
      fill: none;
      stroke: rgba(255,255,255,0.08);
      stroke-width: 4;
    }
    .progress-ring-fill {
      fill: none;
      stroke: var(--orange);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 176;
      stroke-dashoffset: 117; /* 33% = 176 * 0.67 */
      transition: stroke-dashoffset 1s ease;
    }
    .progress-ring-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--orange-lt);
    }

    .continue-text { flex: 1; }
    .continue-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 5px;
    }
    .continue-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 4px;
    }
    .continue-next {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
    }

    .btn-continue {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #000;
      background: linear-gradient(90deg, var(--orange) 0%, var(--orange-lt) 100%);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(255,153,0,0.3);
      white-space: nowrap;
    }
    .btn-continue:hover {
      transform: scale(1.04) translateY(-1px);
      box-shadow: 0 8px 28px rgba(255,153,0,0.4);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .continue-card { flex-direction: column; text-align: center; }
      .nav { gap: 6px; padding: 12px 16px; }
      .nav-link { padding: 7px 16px; font-size: 0.88rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════════ NAV ═══════════════ -->
<nav class="nav">
  <a href="index.html" class="nav-link">Monetise</a>
  <a href="tutorials.html" class="nav-link active">Tutorials</a>
</nav>

<!-- ═══════════════ HERO ═══════════════ -->
<div class="hero">
  <div class="hero-grid-bg"></div>
  <div class="hero-orb"></div>

  <div class="hero-content">

    <div class="hero-badge">
      <span class="hero-badge-dot"></span>
      Top-Rated in United Kingdom
    </div>

    <h1 class="hero-title">
      Build with <span class="hero-title-gradient">AI</span>
    </h1>

    <p class="hero-subtitle">
      Create, launch, and monetise real projects using AI — step by step.
    </p>

    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" type="text" placeholder="Search guides..." />
    </div>

    <div class="continue-card">
      <div class="progress-ring-wrap">
        <svg class="progress-ring-svg" viewBox="0 0 64 64">
          <circle class="progress-ring-track" cx="32" cy="32" r="28"/>
          <circle class="progress-ring-fill" cx="32" cy="32" r="28"/>
        </svg>
        <span class="progress-ring-label">33%</span>
      </div>

      <div class="continue-text">
        <div class="continue-label">Continue Your Project</div>
        <div class="continue-title">Build AI Websites for Local Businesses</div>
        <div class="continue-next">Next: Use the Master Prompt</div>
      </div>

      <a href="#" class="btn-continue">
        Continue Building
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

  </div>
</div>

</body>
</html>
